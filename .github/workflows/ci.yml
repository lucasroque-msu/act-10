name: Run Tests on Push to Main

env:
  PYTHONPATH: src

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p '*_test.py'